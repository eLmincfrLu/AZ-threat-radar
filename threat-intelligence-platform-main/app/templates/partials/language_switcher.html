{# Small CSS flags next to AZ / EN / RU — no inline SVG (avoids sanitizer/CSP issues) #}
{% macro lang_flag(code) -%}
<span class="lang-flag lang-flag-{{ code }}" aria-hidden="true"></span>
{%- endmacro %}
<style>
.lang-switcher-btn,
  .lang-switcher .dropdown-item {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
  }
  .lang-switcher .dropdown-item {
    width: 100%;
  }
.lang-flag {
    width: 16px;
    height: 11px;
    display: inline-block;
    flex-shrink: 0;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.35);
    overflow: hidden;
    position: relative;
    vertical-align: -1px;
  }
  .lang-flag-az {
    background: linear-gradient(to bottom, #00b5e2 0 33.34%, #ef3340 33.34% 66.66%, #509e2f 66.66% 100%);
  }
  .lang-flag-az::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 3.5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    box-shadow: -1.1px 0 0 0 #fff;
  }
  .lang-flag-az::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 3.75px;
    width: 3.4px;
    height: 3.4px;
    background: #fff;
    clip-path: polygon(50.0% 0.0%, 58.0% 30.6%, 85.4% 14.6%, 69.4% 42.0%, 100.0% 50.0%, 69.4% 58.0%, 85.4% 85.4%, 58.0% 69.4%, 50.0% 100.0%, 42.0% 69.4%, 14.6% 85.4%, 30.6% 58.0%, 0.0% 50.0%, 30.6% 42.0%, 14.6% 14.6%, 42.0% 30.6%);
}
  .lang-flag-en {
    background: repeating-linear-gradient(
      to bottom,
      #b22234 0 7.69%,
      #fff 7.69% 15.38%
    );
  }
  .lang-flag-en::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 45%;
    height: 53.8%;
    background: #3c3b6e;
  }
  .lang-flag-ru {
    background: linear-gradient(to bottom, #fff 0 33.34%, #0039a6 33.34% 66.66%, #d52b1e 66.66% 100%);
  }
</style>
<div class="dropdown lang-switcher">
  <button class="btn lang-switcher-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    {{ lang_flag(current_locale) }}
    {{ locale_labels[current_locale] }}
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    {% for code in supported_locales %}
    <li>
      <a class="dropdown-item {% if code == current_locale %}active{% endif %}"
         href="{{ url_for('auth.set_language', lang=code, next=request.url) }}">
        {{ lang_flag(code) }}
        {{ locale_labels[code] }}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
